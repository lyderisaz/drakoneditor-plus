<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DRAKONeditor+</title>
    <meta name="description" content="DRAKONeditor+ shows how to use DrakonWidget in your application. This demo is an online
        mini-editor for drakon flowcharts that does not require registration." />
        <meta property="og:title" content="DRAKONeditor+">
        <meta property="og:description" content="DRAKONeditor+ shows how to use DrakonWidget in your application. This demo is an online
        mini-editor for drakon flowcharts that does not require registration.">
        <meta property="og:image" content="images/og-image.png">
    <link rel="shortcut icon" href="images/favicon.ico" />
    <link rel="icon" type="image/png" href="images/favicon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#18345c" />
    <style>
        *,
        *:before,
        *:after {
            -webkit-box-sizing: border-box;
            -moz-box-sizing: border-box;
            box-sizing: border-box;
        }
    </style>
    <link rel="stylesheet" href="styles/reset.css" />
    <link rel="stylesheet" href="styles/main.css" />
    <link rel="stylesheet" href="validation/drakon-validation.css" />
</head>

<body>
    <div id="main">
        <div id="left-toolbar"></div>
        <div id="editor-area"></div>
        <div id="menu" class="main-menu shadow">
            <div class="menu-block">
                <div id="close-button" class="generic-button simple-button" style="padding-left:0px;">
                    <img src="images/delete.png"><span>Close</span>
                </div>
                <div class="menu-header">DRAKONeditor+</div>
            </div>
            <div class="menu-block">
                <table style="width: 100%;">
                    <tr>
                        <td style="width: 60px;">
                            <div><img class="menu-logo" src="pwa/icon-192.png" /></div>
                        </td>
                        <td style="width: calc(100% - 60px); text-align: right; vertical-align: top;">
                            <p><a href="https://github.com/lyderisaz/drakoneditor-plus">Documentation</a></p>
                            <p>
                            <div id="create-diagram-button" class="generic-button default-button"
                                style="margin-right:0px;">Create diagram</div>
                            </p>
                        </td>
                    </tr>
                </table>

            </div>
            <div class="menu-block">
                <div class="menu-label">Select diagram</div>
                <select id="diagrams-combobox" class="main-menu-combobox"></select>
            </div>
            <div class="menu-block">
                <div id="delete-diagram-button" class="generic-button simple-button">Delete diagram</div>
                <div id="duplicate-diagram-button" class="generic-button simple-button">Duplicate diagram</div>
                <div id="set-diagram-json-button" class="generic-button simple-button"
                    style="margin-right: 0px;">Diagram JSON...
                </div>
            </div>
            <div class="menu-block">
                <div class="menu-label">Export</div>
                <div id="export-png-button" class="generic-button simple-button">PNG</div>
                <div id="export-svg-button" class="generic-button simple-button">SVG</div>
                <div id="export-json-button" class="generic-button simple-button">JSON (.drakon)</div>
            </div>
            <div class="menu-block">
                <div class="menu-label">Import</div>
                <div id="import-file-button" class="generic-button simple-button">Open file (.drakon, .json, .svg)...</div>
            </div>
            <div class="menu-block">
                <div class="menu-label">Color theme</div>
                <select id="themes-combobox" class="main-menu-combobox"></select>
            </div>
            <div class="menu-block" style="height: 46px;">
                <div id="set-theme-json-button" class="generic-button simple-button right-button"
                    style="margin-right: 0px;">Theme JSON...</div>
            </div>
            <div class="menu-block">
                <div class="menu-label">Editor mode</div>
                <select id="modes-combobox" class="main-menu-combobox"></select>
            </div>
            <div class="menu-block">
                <div class="menu-label">Validation</div>
                <select id="validation-mode-combobox" class="main-menu-combobox"></select>
                <div id="validation-mode-hint" class="dv-menu-hint"></div>
            </div>
            <div class="menu-block">
                <div id="validation-rules-button" class="generic-button simple-button">Edit rules...</div>
                <div id="validation-help-button" class="generic-button simple-button">How it works</div>
            </div>
            <div class="menu-block">
                <div id="reset-all-diagrams-button" class="generic-button bad-button">Reset all diagrams</div>
            </div>
            <div style="height: 10px"></div>
        </div>
        <div id="snack-root"></div>
        <div id="question-root"></div>
        <div id="popup-root"></div>

    </div>
    <script src="libs/drakonwidget.js"></script>
    <script src="libs/canvas2svg.js"></script>
    <script src="export/drakon-export.js"></script>
    <script src="import/drakon-import.js"></script>
    <script src="validation/drakon-validator.js"></script>
    <script src="validation/rules/structure-rules.js"></script>
    <script src="validation/rules/content-rules.js"></script>
    <script src="validation/rules-config.js"></script>
    <script src="validation/drakon-validation-ui.js"></script>
    <script src="libs/mousetrap.min.js"></script>
    <script src="libs/simplewidgets.js"></script>
    <script src="js/examples.js"></script>
    <script src="js/themes.js"></script>
    <script src="js/main.js"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){});}</script>
</body>

</html>
